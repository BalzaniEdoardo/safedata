name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false  # finish every OS, so one failure does not hide others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Show git version  # the git tests need 2.32 or later
        run: git --version
      - name: Run tests
        run: uv run pytest -q
