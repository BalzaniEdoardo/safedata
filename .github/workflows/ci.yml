name: ci

# tests and installer check the code; docs builds the documentation, failing on
# broken links. On pushes to main, deploy-docs then publishes the documentation
# on GitHub Pages, but only once all three have passed.
# One-time repository setting: Settings > Pages > Source: GitHub Actions.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false  # finish every OS, so one failure does not hide others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Show git version  # the git tests need 2.32 or later
        run: git --version
      - name: Run tests
        run: uv run pytest -q

  # Runs the installers on clean machines, the way a new user would: without
  # setup-uv, so the scripts install uv themselves. Installs this commit
  # (SAFEDATA_SOURCE), then runs the installer again to check upgrading.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SAFEDATA_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          sh install.sh
          "$HOME/.local/bin/safedata" --help
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A script's `exit 1` does not stop a pwsh step by itself, so check after each command.
        run: |
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\.local\bin\safedata.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"  # silence Material's notice about MkDocs 2.0; pyproject.toml keeps mkdocs < 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Build the documentation
        run: uv run --group docs mkdocs build --strict
      - name: Prepare the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, installer, docs]  # publish only a version whose tests and installers pass
    runs-on: ubuntu-latest
    permissions:
      pages: write     # to publish on GitHub Pages
      id-token: write  # to prove the publication comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false  # let a running publication finish
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
