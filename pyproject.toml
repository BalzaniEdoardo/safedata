[project]
name = "safedata"
version = "0.1.0"
description = "Records in a git repository: a validating editor, git add-ons, and Excel analysis via Power Query"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
safedata = "safedata.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safedata"]
