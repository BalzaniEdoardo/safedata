[project]
name = "safedata"
version = "0.1.0"
description = "Records kept in git, edited through Excel sheets, read by analysis workbooks"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
safedata = "safedata.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safedata"]
